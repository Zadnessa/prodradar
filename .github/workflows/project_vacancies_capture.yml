name: Project Vacancy Snapshot
on:
  push:
    branches: [codex/export-project-vacancies]
    paths: [.github/workflows/project_vacancies_capture.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/codex/export-project-vacancies'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prodradar-test
    concurrency:
      group: prodradar-test-collector
      cancel-in-progress: false
    env:
      TEST_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TEST_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Прочитать базу без изменений
        run: python .github/project_vacancies_export/capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-vacancy-snapshot
          path: .github/project_vacancies_export/data
          retention-days: 30
      - name: Сохранить слепок для нормализации
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/project_vacancies_export/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Сохранить тексты вакансий из тестовой базы"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
