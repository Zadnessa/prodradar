name: Audit Sources (Read Only)

on:
  workflow_dispatch:

concurrency:
  group: read-only-source-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bank_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prodradar-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-collector.txt
      - run: python -m unittest discover -s tests -v
      - name: Check every bank product description independently of browser installation
        run: python scripts/run_profile.py --profile test audit --sources alfa tochka tbank --enrich-limit 999 --no-browser --output bank-sources-check.json
        env:
          TEST_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          TEST_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-source-audit
          path: bank-sources-check.json
          retention-days: 14
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prodradar-test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-collector.txt
      - run: playwright install chromium --with-deps
      - run: sudo apt-get install -y libnss3-tools
      - name: Check parser regression tests
        run: python -m unittest discover -s tests -v
      - name: Check official TLS certificate chains
        run: python scripts/check_source_tls.py --output source-tls-check.json
      - name: Audit enabled parsers and descriptions without writes
        if: always()
        run: python scripts/run_profile.py --profile test audit --exclude-sources tbank --enrich-limit 3 --full-enrich-sources alfa tochka domclick aviasales --output sources-check.json
        env:
          TEST_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          TEST_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
      - name: Inspect official vacancy pages and browser network requests
        if: always()
        run: python scripts/inspect_source_browser.py --source-ca --output browser-sources-check.json
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: |
            sources-check.json
            browser-sources-check.json
            source-tls-check.json
          retention-days: 14
