name: Normalize Project Vacancy Export
on:
  push:
    branches: [codex/export-project-vacancies]
    paths: [.github/workflows/project_vacancies_normalize.yml, .github/project_vacancies_export/normalize.py, .github/project_vacancies_export/normalization_overrides.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: project-vacancy-export
  cancel-in-progress: true
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5
      - name: Разнести исходные тексты по разделам
        run: python .github/project_vacancies_export/normalize.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-management-export
          path: .github/project_vacancies_export/output
          retention-days: 30
      - name: Сохранить архив и материал проверки
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/project_vacancies_export/output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Сохранить архив проектных вакансий"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
