name: Career closet v2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/career-closet-v2
    paths:
      - .github/career_closet_v2/build_workbook.py
      - .github/career_closet_v2/compact_*.json
      - .github/career_closet_v2/catalogue_*.json
      - .github/career_closet_v2/humanizer_lint.py
      - .github/workflows/career-closet-v2.yml

permissions:
  contents: write

concurrency:
  group: career-closet-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbook:
    if: github.ref == 'refs/heads/codex/career-closet-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout frozen public evidence
        uses: actions/checkout@v4
        with:
          ref: a1e65e5a89cc092430369c16a408dc3d320723d8
          path: original
          sparse-checkout: .github/career_closet
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook and rendering tools
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libreoffice-calc poppler-utils fonts-crosextra-carlito fonts-dejavu-core

      - name: Build, recalculate and test workbook
        run: |
          python .github/career_closet_v2/build_workbook.py --original original/.github/career_closet --maps .github/career_closet_v2 --output output/career_closet_v2 --qa --recalculate --preview
          python .github/career_closet_v2/humanizer_lint.py output/career_closet_v2/own_text.txt

      - name: Save artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-closet-v2-${{ github.run_id }}
          path: output/career_closet_v2
          if-no-files-found: ignore
          retention-days: 30

      - name: Save workbook and previews in the same branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          cp output/career_closet_v2/Карьерный_шкаф.xlsx .github/career_closet_v2/Карьерный_шкаф.xlsx
          cp output/career_closet_v2/preview_project.png .github/career_closet_v2/preview_project.png
          cp output/career_closet_v2/preview_commercial.png .github/career_closet_v2/preview_commercial.png
          cp output/career_closet_v2/preview.json .github/career_closet_v2/preview.json
          cp output/career_closet_v2/own_text.txt .github/career_closet_v2/own_text.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/career_closet_v2/Карьерный_шкаф.xlsx .github/career_closet_v2/preview_project.png .github/career_closet_v2/preview_commercial.png .github/career_closet_v2/preview.json .github/career_closet_v2/own_text.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Собрать карьерный шкаф и превью Calc"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
