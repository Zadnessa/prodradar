name: Cian GH Actions Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -V

      - run: pip install "playwright==1.53.0" "aiohttp==3.12.15" "curl_cffi==0.13.0"
      - run: playwright install chromium --with-deps

      - name: Run probe
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import platform
          import time
          from pathlib import Path

          import aiohttp
          import playwright
          from playwright.async_api import async_playwright
          from curl_cffi import requests as cffi_requests

          ART = Path("artifacts")
          ART.mkdir(exist_ok=True)

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/146.0.0.0 Safari/537.36"
          )

          API_URL = "https://api.cian.ru/job-vacancies-backend/v2/get-vacancies/"
          PAYLOAD = {"filters": {"specializations": ["58"]}}

          def dump(name, text):
              (ART / name).write_text(text, encoding="utf-8")

          async def main():
              print("GITHUB_SHA =", os.getenv("GITHUB_SHA"))
              print("GITHUB_REF =", os.getenv("GITHUB_REF"))
              print("platform =", platform.platform())
              print("python =", platform.python_version())
              print("playwright =", playwright.__version__)

              netlog = []

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                          "--no-first-run",
                          "--no-default-browser-check",
                      ],
                  )
                  context = await browser.new_context(
                      user_agent=UA,
                      viewport={"width": 1920, "height": 1080},
                      locale="ru-RU",
                  )
                  await context.add_init_script(
                      "Object.defineProperty(navigator, 'webdriver', {get: () => undefined})"
                  )
                  page = await context.new_page()

                  print("browser.version =", await browser.version())

                  @page.on("response")
                  async def on_response(resp):
                      url = resp.url
                      if "cian.ru" not in url:
                          return
                      headers = await resp.all_headers()
                      set_cookie = headers.get("set-cookie")
                      netlog.append({
                          "url": url,
                          "status": resp.status,
                          "content_type": headers.get("content-type"),
                          "has_set_cookie": bool(set_cookie),
                          "set_cookie_preview": (set_cookie[:300] if set_cookie else None),
                      })

                  started = time.time()
                  await page.goto("https://www.cian.ru/vacancies/", wait_until="domcontentloaded", timeout=30000)

                  # Снимки cookies во времени
                  snapshots = []
                  for delay in (0, 3, 8, 20):
                      if delay:
                          await asyncio.sleep(delay)
                      cookies = await context.cookies()
                      cian = [c for c in cookies if "cian.ru" in (c.get("domain") or "")]
                      snapshots.append({
                          "t": round(time.time() - started, 1),
                          "count": len(cian),
                          "cookies": [
                              {
                                  "name": c.get("name"),
                                  "domain": c.get("domain"),
                                  "path": c.get("path"),
                                  "expires": c.get("expires"),
                                  "secure": c.get("secure"),
                                  "sameSite": c.get("sameSite"),
                              }
                              for c in cian
                          ]
                      })

                  final_html = await page.content()
                  final_title = await page.title()
                  final_url = page.url
                  await page.screenshot(path=str(ART / "cian_page.png"), full_page=True)
                  dump("cian_page.html", final_html)
                  dump("network_log.json", json.dumps(netlog, ensure_ascii=False, indent=2))
                  dump("cookie_snapshots.json", json.dumps(snapshots, ensure_ascii=False, indent=2))

                  print("final_url =", final_url)
                  print("final_title =", final_title)
                  print("html_has_captcha =", "captcha" in final_html.lower())
                  print("html_head =", final_html[:1000].replace("\n", " "))

                  cookies = await context.cookies()
                  cian = [c for c in cookies if "cian.ru" in (c.get("domain") or "")]
                  cookie_string = "; ".join(
                      f"{c['name']}={c['value']}"
                      for c in cian
                      if c.get("name") and c.get("value")
                  )
                  print("cookie_names =", [c.get("name") for c in cian])

                  headers = {
                      "accept": "*/*",
                      "accept-language": "ru-RU,ru;q=0.9",
                      "content-type": "application/json",
                      "origin": "https://www.cian.ru",
                      "referer": "https://www.cian.ru/",
                      "cookie": cookie_string,
                      "sec-ch-ua": '"Chromium";v="146", "Not-A.Brand";v="24", "Google Chrome";v="146"',
                      "sec-ch-ua-mobile": "?0",
                      "sec-ch-ua-platform": '"Windows"',
                      "sec-fetch-dest": "empty",
                      "sec-fetch-mode": "cors",
                      "sec-fetch-site": "same-site",
                      "user-agent": UA,
                  }

                  async def test_aiohttp(label, delay):
                      if delay:
                          await asyncio.sleep(delay)
                      async with aiohttp.ClientSession() as session:
                          async with session.post(API_URL, headers=headers, json=PAYLOAD, timeout=30) as resp:
                              body = await resp.text()
                              print(f"[aiohttp:{label}] status={resp.status} ct={resp.headers.get('Content-Type')}")
                              print(body[:500].replace("\n", " "))
                              dump(f"aiohttp_{label}.txt", body[:5000])

                  def test_cffi(label, delay):
                      if delay:
                          time.sleep(delay)
                      resp = cffi_requests.post(
                          API_URL,
                          json=PAYLOAD,
                          headers=headers,
                          impersonate="chrome131",
                          timeout=30,
                      )
                      print(f"[curl_cffi:{label}] status={resp.status_code} ct={resp.headers.get('Content-Type')}")
                      print(resp.text[:500].replace("\n", " "))
                      dump(f"curl_cffi_{label}.txt", resp.text[:5000])

                  await test_aiohttp("immediate", 0)
                  test_cffi("immediate", 0)

                  await test_aiohttp("plus20s", 20)
                  test_cffi("plus20s", 20)

                  await browser.close()

          asyncio.run(main())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cian-probe-artifacts
          path: artifacts/
