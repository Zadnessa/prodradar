name: Check Test Environment
run-name: ${{ inputs.setup_github != 'none' && inputs.setup_github != '' && format('Setup prodradar-test {0} {1}', inputs.setup_github, inputs.setup_request) || 'Check Test Environment' }}

on:
  push:
    branches:
      - 'codex/**'
    paths:
      - '.github/workflows/check_test_environment.yml'
      - 'scripts/check_environment.py'
  workflow_dispatch:
    inputs:
      setup_github:
        description: 'Настройка только prodradar-test через отдельный PAT'
        type: choice
        options: [none, export-key, apply]
        default: none
      setup_request:
        description: 'Несекретный ID автоматической настройки'
        type: string
        required: false
      encrypted_settings:
        description: 'Пакет настроек с зашифрованными секретами; без plaintext'
        type: string
        required: false
      audit_sources:
        description: 'Read-only аудит фирменных API без доступа к БД и Telegram'
        type: boolean
        required: false
        default: false
      source_catalog:
        description: 'JSON справочников тестовой БД; без секретов и пользователей'
        type: string
        required: false
      capture_pool_only:
        description: 'Сохранить общий test пул без доставки и изменения выдачи'
        type: boolean
        default: false
      use_source_pool:
        description: 'При collect_test использовать свежий сохранённый пул'
        type: boolean
        default: false
      enrich_role_pool:
    if: github.event_name == 'workflow_dispatch' && inputs.enrich_role_pool == true && inputs.capture_pool_only != true && inputs.collect_test != true && inputs.audit_sources != true && (inputs.setup_github == 'none' || inputs.setup_github == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prodradar-test
    concurrency:
      group: prodradar-test-collector
      cancel-in-progress: false
    env:
      TEST_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TEST_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
      HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
      REVIEW_SOURCES: ${{ inputs.inspect_sources }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-collector.txt
      - run: playwright install chromium --with-deps
      - run: python scripts/run_profile.py --profile test review-roles
