name: Read-only Production IO Diagnostic

on:
  push:
    branches: [codex/diagnose-production-io]
    paths:
      - '.github/workflows/production_io_diagnostic.yml'
      - '.github/production_io_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Прочитать системную статистику без записей и Telegram
        run: python .github/production_io_diagnostic.py --capabilities-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  management:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: prodradar-test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить уже настроенный Management token, только read-only SQL
        run: python .github/production_io_diagnostic.py --management-only
        env:
          SUPABASE_URL: https://ykbtejjedefibdgyfgov.supabase.co
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
