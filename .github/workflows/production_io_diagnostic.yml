name: Read-only Production IO Diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Разовая проверка без изменения базы'
        type: choice
        options: [metrics, events, capabilities]
        default: metrics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Прочитать выбранную статистику без записей и Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          case "$DIAGNOSTIC_MODE" in
            metrics) python .github/production_io_diagnostic.py ;;
            events) python .github/production_io_diagnostic.py --events-only ;;
            capabilities) python .github/production_io_diagnostic.py --capabilities-only ;;
            *) exit 1 ;;
          esac

  management:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: prodradar-test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Прочитать системную SQL-статистику при наличии Management token
        run: python .github/production_io_diagnostic.py --management-only
        env:
          SUPABASE_URL: https://ykbtejjedefibdgyfgov.supabase.co
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
